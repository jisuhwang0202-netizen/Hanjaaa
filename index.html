<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고사성어 200 — 학습과 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ece3cd;
    --paper-deep:#e2d6ba;
    --ink:#241f18;
    --ink-soft:#5c523f;
    --ink-faint:#8b7f68;
    --seal:#a8321f;
    --seal-deep:#822417;
    --jade:#3f6b52;
    --jade-deep:#2c4d3a;
    --line:#c7b998;
    --card-bg:#f4ecd8;
    --shadow:0 1px 0 rgba(36,31,24,.06);
    --radius:2px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c1913;
      --paper-deep:#242019;
      --ink:#ece3cd;
      --ink-soft:#c9bc9c;
      --ink-faint:#8a8065;
      --seal:#d1573c;
      --seal-deep:#e17a5f;
      --jade:#6fae8b;
      --jade-deep:#8ec7a8;
      --line:#3a3427;
      --card-bg:#231f18;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1c1913;
    --paper-deep:#242019;
    --ink:#ece3cd;
    --ink-soft:#c9bc9c;
    --ink-faint:#8a8065;
    --seal:#d1573c;
    --seal-deep:#e17a5f;
    --jade:#6fae8b;
    --jade-deep:#8ec7a8;
    --line:#3a3427;
    --card-bg:#231f18;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at 15% 8%, rgba(168,50,31,0.035), transparent 45%),
      radial-gradient(ellipse at 90% 92%, rgba(63,107,82,0.03), transparent 50%);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    line-height:1.6;
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:36px 20px 80px;
  }

  /* ---- Header ---- */
  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    border-bottom:3px double var(--ink);
    padding-bottom:18px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .title-block h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:clamp(28px,6vw,40px);
    margin:0 0 4px;
    letter-spacing:.02em;
  }
  .title-block p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
  }
  .seal-badge{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:13px;
    color:#f4ecd8;
    background:var(--seal);
    border:2px solid var(--seal-deep);
    padding:8px 12px;
    border-radius:3px;
    writing-mode:vertical-rl;
    letter-spacing:.15em;
    flex-shrink:0;
    box-shadow:var(--shadow);
  }

  /* ---- Mode tabs ---- */
  nav.modes{
    display:flex;
    gap:8px;
    margin-bottom:26px;
  }
  nav.modes button{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:16px;
    background:transparent;
    border:1.5px solid var(--line);
    color:var(--ink-soft);
    padding:10px 20px;
    cursor:pointer;
    border-radius:3px;
    transition:background .15s, color .15s, border-color .15s;
  }
  nav.modes button.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  nav.modes button:not(.active):hover{
    border-color:var(--ink-soft);
    color:var(--ink);
  }

  .view{display:none;}
  .view.active{display:block;}

  /* ---- List grid ---- */
  .list-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    color:var(--ink-faint);
    font-size:13px;
  }
  .list-toolbar input{
    font-family:'Noto Sans KR',sans-serif;
    font-size:14px;
    padding:8px 12px;
    border:1.5px solid var(--line);
    border-radius:3px;
    background:var(--card-bg);
    color:var(--ink);
    width:200px;
    max-width:45vw;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:10px;
  }
  .tile{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 12px 10px;
    cursor:pointer;
    text-align:left;
    transition:transform .1s, border-color .15s;
    position:relative;
  }
  .tile:hover{
    border-color:var(--seal);
    transform:translateY(-1px);
  }
  .tile .no{
    font-size:11px;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  .tile .hanja{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:21px;
    margin:2px 0 2px;
    letter-spacing:.02em;
  }
  .tile .reading{
    font-size:13px;
    color:var(--ink-soft);
  }

  /* ---- Detail modal ---- */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(20,17,12,.5);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--paper-deep);
    border:1px solid var(--line);
    border-radius:4px;
    max-width:460px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    padding:26px 24px 22px;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
  }
  .modal .mno{
    font-size:12px;
    color:var(--ink-faint);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .modal .mno button{
    background:none;
    border:none;
    color:var(--ink-faint);
    font-size:20px;
    cursor:pointer;
    line-height:1;
    padding:2px 6px;
  }
  .modal .mhanja{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:44px;
    margin:6px 0 2px;
    letter-spacing:.03em;
  }
  .modal .mreading{
    font-family:'Noto Serif KR', serif;
    font-size:20px;
    color:var(--seal);
    font-weight:700;
    margin-bottom:16px;
  }
  .char-table{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(90px,1fr));
    gap:8px;
    margin-bottom:16px;
  }
  .char-cell{
    border:1px solid var(--line);
    border-radius:3px;
    padding:8px 6px;
    text-align:center;
    background:var(--card-bg);
  }
  .char-cell .c{
    font-family:'Noto Serif KR', serif;
    font-size:24px;
    font-weight:700;
    display:block;
  }
  .char-cell .m{
    font-size:12px;
    color:var(--ink-soft);
    display:block;
    margin-top:3px;
  }
  .modal .meaning{
    font-size:15px;
    line-height:1.7;
    border-top:1px dashed var(--line);
    padding-top:14px;
  }
  .modal .meaning .label{
    font-size:11px;
    color:var(--ink-faint);
    display:block;
    margin-bottom:4px;
  }

  /* ---- Quiz setup ---- */
  .quiz-setup h2{
    font-family:'Noto Serif KR', serif;
    font-size:20px;
    margin:0 0 6px;
  }
  .quiz-setup p.sub{
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 18px;
  }
  .type-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
    gap:10px;
    margin-bottom:6px;
  }
  .type-btn{
    text-align:left;
    border:1.5px solid var(--line);
    background:var(--card-bg);
    color:var(--ink);
    padding:14px 16px;
    border-radius:4px;
    cursor:pointer;
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:16px;
  }
  .type-btn span{
    display:block;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:400;
    font-size:12px;
    color:var(--ink-faint);
    margin-top:4px;
  }
  .type-btn.selected{
    background:var(--seal);
    border-color:var(--seal-deep);
    color:#f9f2e2;
  }
  .type-btn.selected span{color:#f4ddd2;}
  .q-typelabel{
    text-align:center;
    font-size:12px;
    color:var(--ink-faint);
    margin-bottom:6px;
    letter-spacing:.05em;
  }
  .range-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
    gap:8px;
    margin-bottom:18px;
  }
  .range-btn{
    border:1.5px solid var(--line);
    background:var(--card-bg);
    color:var(--ink-soft);
    padding:10px 6px;
    border-radius:3px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    text-align:center;
  }
  .range-btn.selected{
    background:var(--jade);
    border-color:var(--jade-deep);
    color:#f4ecd8;
  }
  .quiz-controls{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  .quiz-controls button.pill{
    border:1.5px solid var(--ink-soft);
    background:transparent;
    color:var(--ink-soft);
    padding:6px 14px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
  }
  .start-btn{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:16px;
    background:var(--seal);
    color:#f9f2e2;
    border:2px solid var(--seal-deep);
    padding:12px 28px;
    border-radius:3px;
    cursor:pointer;
  }
  .start-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .sel-count{
    font-size:13px;
    color:var(--ink-faint);
  }

  /* ---- Quiz running ---- */
  .quiz-card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:4px;
    padding:30px 26px;
    max-width:560px;
    margin:0 auto;
  }
  .quiz-progress{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--ink-faint);
    margin-bottom:16px;
  }
  .quiz-progress .bar{
    height:4px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
    flex:1;
    margin:0 12px;
  }
  .quiz-progress .bar > div{
    height:100%;
    background:var(--jade);
  }
  .q-meaning{
    font-size:17px;
    line-height:1.8;
    margin-bottom:18px;
    text-align:center;
  }
  .q-chars{
    display:none;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .q-chars.show{display:flex;}
  .q-chars .char-cell{min-width:76px;}
  .q-answer-row{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .q-answer-row input{
    flex:1;
    font-family:'Noto Serif KR', serif;
    font-size:20px;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:3px;
    background:var(--paper);
    color:var(--ink);
  }
  .q-answer-row input:focus{
    outline:none;
    border-color:var(--seal);
  }
  .q-answer-row button{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:15px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:0 22px;
    border-radius:3px;
    cursor:pointer;
  }
  .q-feedback{
    min-height:64px;
    border-radius:3px;
    padding:12px 14px;
    font-size:14px;
    display:none;
  }
  .q-feedback.show{display:block;}
  .q-feedback.correct{
    background:rgba(63,107,82,.12);
    border:1px solid var(--jade);
    color:var(--jade-deep);
  }
  .q-feedback.wrong{
    background:rgba(168,50,31,.10);
    border:1px solid var(--seal);
    color:var(--seal-deep);
  }
  .q-feedback .ans-hanja{
    font-family:'Noto Serif KR', serif;
    font-size:18px;
    font-weight:700;
  }
  .q-feedback .ans-breakdown{
    display:inline-block;
    margin-top:6px;
    font-family:'Noto Serif KR', serif;
    font-size:14px;
    color:inherit;
    opacity:.85;
  }
  .q-next-row{
    display:flex;
    justify-content:flex-end;
    margin-top:12px;
  }
  .q-next-row button{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    background:var(--seal);
    color:#f9f2e2;
    border:none;
    padding:9px 20px;
    border-radius:3px;
    cursor:pointer;
    display:none;
  }
  .q-next-row button.show{display:inline-block;}

  /* ---- Result ---- */
  .result-card{
    max-width:560px;
    margin:0 auto;
    text-align:center;
  }
  .result-card .score{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:52px;
    margin:10px 0 2px;
    color:var(--seal);
  }
  .result-card .score-label{
    color:var(--ink-soft);
    font-size:14px;
    margin-bottom:26px;
  }
  .result-actions{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:30px;
    flex-wrap:wrap;
  }
  .result-actions button{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:14px;
    padding:10px 18px;
    border-radius:3px;
    cursor:pointer;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
  }
  .result-actions button.primary{
    background:var(--seal);
    border-color:var(--seal-deep);
    color:#f9f2e2;
  }
  .wrong-list{
    text-align:left;
    border-top:1px dashed var(--line);
    padding-top:18px;
  }
  .wrong-list h3{
    font-family:'Noto Serif KR', serif;
    font-size:16px;
    margin:0 0 12px;
  }
  .wrong-item{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .wrong-item .wh{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:17px;
    min-width:64px;
  }
  .wrong-item .wr{
    color:var(--seal);
    font-weight:700;
    min-width:64px;
  }
  .wrong-item .wm{
    color:var(--ink-soft);
    flex:1;
  }
  .empty-msg{
    text-align:center;
    color:var(--ink-faint);
    padding:40px 0;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title-block">
      <h1>故事成語 二百</h1>
      <p>2026 고등학생이 알아야 할 필수 고사성어 200 — 학습 &amp; 퀴즈</p>
    </div>
    <div class="seal-badge">學而時習</div>
  </header>

  <nav class="modes">
    <button class="active" data-mode="list">목록 보기</button>
    <button data-mode="quiz">퀴즈</button>
  </nav>

  <!-- LIST VIEW -->
  <section id="view-list" class="view active">
    <div class="list-toolbar">
      <span id="list-count">전체 200개</span>
      <input id="search" type="text" placeholder="검색 (한자·한글·뜻)">
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- QUIZ VIEW -->
  <section id="view-quiz" class="view">

    <div id="quiz-setup" class="quiz-setup">
      <h2>퀴즈 방식을 선택하세요</h2>
      <p class="sub">뜻을 보고 고사성어를 맞히거나, 상황 설명을 보고 어울리는 고사성어를 맞힐 수 있어요.</p>
      <div class="type-grid" id="type-grid">
        <button class="type-btn selected" data-type="meaning">뜻으로 풀기<span>고사성어의 뜻을 보고 맞히기</span></button>
        <button class="type-btn" data-type="situation">상황으로 풀기<span>상황 설명을 보고 어울리는 성어 맞히기</span></button>
      </div>
      <h2 style="margin-top:26px;">범위를 선택하세요</h2>
      <p class="sub">10개 단위로 원하는 범위를 골라 퀴즈를 시작합니다. 여러 범위를 함께 선택할 수 있어요.</p>
      <div class="range-grid" id="range-grid"></div>
      <div class="quiz-controls">
        <button class="pill" id="select-all">전체 선택</button>
        <button class="pill" id="select-none">선택 해제</button>
        <span class="sel-count" id="sel-count">선택된 문항: 0개</span>
      </div>
      <button class="start-btn" id="start-quiz" disabled>퀴즈 시작</button>
    </div>

    <div id="quiz-running" style="display:none;">
      <div class="quiz-progress">
        <span id="prog-text">1 / 10</span>
        <div class="bar"><div id="prog-bar" style="width:0%"></div></div>
        <span id="prog-score">맞음 0</span>
      </div>
      <div class="quiz-card">
        <div class="q-typelabel" id="q-typelabel"></div>
        <div class="q-meaning" id="q-meaning"></div>
        <div class="q-chars" id="q-chars"></div>
        <div class="q-answer-row">
          <input type="text" id="q-input" placeholder="한글로 답을 입력하세요" autocomplete="off">
          <button id="q-check">확인</button>
        </div>
        <div class="q-feedback" id="q-feedback"></div>
        <div class="q-next-row">
          <button id="q-next">다음 문제 →</button>
        </div>
      </div>
    </div>

    <div id="quiz-result" style="display:none;">
      <div class="result-card">
        <div class="score-label">결과</div>
        <div class="score" id="result-score">0 / 0</div>
        <div class="score-label" id="result-sub"></div>
        <div class="result-actions">
          <button class="primary" id="retry-wrong">틀린 문제만 다시 풀기</button>
          <button id="retry-same">같은 범위 다시 풀기</button>
          <button id="back-setup">범위 다시 선택</button>
        </div>
        <div class="wrong-list" id="wrong-list"></div>
      </div>
    </div>

  </section>

</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const IDIOMS = [
[1,"根幹","근간",[["根","뿌리"],["幹","줄기"]],"어떤 일이나 사물의 가장 중요한 바탕·기본구조·핵심","이 정책은 우리 회사 경영 전략의 가장 중요한 바탕이 되는 부분이다."],
[2,"白眉","백미",[["白","희다"],["眉","눈썹"]],"여럿 가운데서 가장 뛰어난 사람이나 훌륭한 물건","이번 전시회에 나온 작품들 중 단연 이 그림이 가장 뛰어나다는 평가를 받았다."],

      grid.appendChild(tile);
    });
    listCount.textContent = f ? `검색 결과 ${shown}개` : `전체 ${shown}개`;
  }
  renderGrid('');
  search.addEventListener('input', ()=>renderGrid(search.value));

  // ---- Modal ----
  const backdrop = document.getElementById('modal-backdrop');
  const modalContent = document.getElementById('modal-content');
  function openModal(no){
    const item = IDIOMS.find(x=>x[0]===no);
    if(!item) return;
    const [n, hanja, reading, chars, meaning] = item;
    modalContent.innerHTML = `
      <div class="mno"><span>제 ${n}번</span><button id="modal-close" aria-label="닫기">&times;</button></div>
      <div class="mhanja">${hanja}</div>
      <div class="mreading">${reading}</div>
      <div class="char-table">
        ${chars.map(c=>`<div class="char-cell"><span class="c">${c[0]}</span><span class="m">${c[1]}</span></div>`).join('')}
      </div>
      <div class="meaning"><span class="label">뜻</span>${meaning}</div>
    `;
    backdrop.classList.add('show');
    document.getElementById('modal-close').addEventListener('click', closeModal);
  }
  function closeModal(){ backdrop.classList.remove('show'); }
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeModal(); });

  // ---- Mode tabs ----
  const modeBtns = document.querySelectorAll('nav.modes button');
  const views = { list: document.getElementById('view-list'), quiz: document.getElementById('view-quiz') };
  modeBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      modeBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      Object.values(views).forEach(v=>v.classList.remove('active'));
      views[btn.dataset.mode].classList.add('active');
    });
  });

  // ---- Quiz type selection ----
  let quizType = 'meaning'; // 'meaning' or 'situation'
  const typeGrid = document.getElementById('type-grid');
  typeGrid.querySelectorAll('.type-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      typeGrid.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      quizType = btn.dataset.type;
    });
  });

  // ---- Quiz range selection ----
  const rangeGrid = document.getElementById('range-grid');
  const selCount = document.getElementById('sel-count');
  const startBtn = document.getElementById('start-quiz');
  const selectedRanges = new Set();

  const ranges = [];
  for(let s=1; s<=200; s+=10){ ranges.push([s, Math.min(s+9,200)]); }
  ranges.forEach(([s,e])=>{
    const btn = document.createElement('button');
    btn.className = 'range-btn';
    btn.textContent = `${s}–${e}`;
    btn.dataset.s = s; btn.dataset.e = e;
    btn.addEventListener('click', ()=>{
      const key = s+'-'+e;
      if(selectedRanges.has(key)){ selectedRanges.delete(key); btn.classList.remove('selected'); }
      else { selectedRanges.add(key); btn.classList.add('selected'); }
      updateSelCount();
    });
    rangeGrid.appendChild(btn);
  });

  function getSelectedItems(){
    const items = [];
    selectedRanges.forEach(key=>{
      const [s,e] = key.split('-').map(Number);
      IDIOMS.forEach(it=>{ if(it[0]>=s && it[0]<=e) items.push(it); });
    });
    return items;
  }
  function updateSelCount(){
    const n = getSelectedItems().length;
    selCount.textContent = `선택된 문항: ${n}개`;
    startBtn.disabled = n === 0;
  }

  document.getElementById('select-all').addEventListener('click', ()=>{
    rangeGrid.querySelectorAll('.range-btn').forEach(btn=>{
      selectedRanges.add(btn.dataset.s+'-'+btn.dataset.e);
      btn.classList.add('selected');
    });
    updateSelCount();
  });
  document.getElementById('select-none').addEventListener('click', ()=>{
    selectedRanges.clear();
    rangeGrid.querySelectorAll('.range-btn').forEach(btn=>btn.classList.remove('selected'));
    updateSelCount();
  });

  // ---- Quiz engine ----
  const setupEl = document.getElementById('quiz-setup');
  const runningEl = document.getElementById('quiz-running');
  const resultEl = document.getElementById('quiz-result');

  const qMeaning = document.getElementById('q-meaning');
  const qChars = document.getElementById('q-chars');
  const qInput = document.getElementById('q-input');
  const qCheck = document.getElementById('q-check');
  const qFeedback = document.getElementById('q-feedback');
  const qNext = document.getElementById('q-next');
  const progText = document.getElementById('prog-text');
  const progBar = document.getElementById('prog-bar');
  const progScore = document.getElementById('prog-score');

  let quizPool = [];   // current queue of items to ask
  let quizIndex = 0;
  let quizCorrect = 0;
  let quizWrong = [];  // items answered wrong
  let currentAnswered = false;
  let lastPool = [];   // for "retry same range"

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function startQuiz(pool){
    quizPool = shuffle(pool);
    lastPool = pool;
    quizIndex = 0;
    quizCorrect = 0;
    quizWrong = [];
    setupEl.style.display = 'none';
    resultEl.style.display = 'none';
    runningEl.style.display = 'block';
    showQuestion();
  }

  function showQuestion(){
    currentAnswered = false;
    const item = quizPool[quizIndex];
    const [no, hanja, reading, chars, meaning, situation] = item;
    document.getElementById('q-typelabel').textContent = quizType === 'situation' ? '다음 상황에 어울리는 고사성어는?' : '다음 뜻에 해당하는 고사성어는?';
    qMeaning.textContent = quizType === 'situation' ? situation : meaning;
    qChars.innerHTML = '';
    qChars.classList.remove('show');
    qInput.value = '';
    qInput.disabled = false;
    qFeedback.className = 'q-feedback';
    qFeedback.innerHTML = '';
    qNext.classList.remove('show');
    progText.textContent = `${quizIndex+1} / ${quizPool.length}`;
    progBar.style.width = `${(quizIndex/quizPool.length)*100}%`;
    progScore.textContent = `맞음 ${quizCorrect}`;
    qInput.focus();
  }

  function checkAnswer(){
    if(currentAnswered) return;
    const item = quizPool[quizIndex];
    const [no, hanja, reading, chars, meaning, situation] = item;
    const userAns = qInput.value.trim().replace(/\s+/g,'');
    const correct = userAns === reading;
    currentAnswered = true;
    qInput.disabled = true;
    qChars.innerHTML = chars.map(c=>`<div class="char-cell"><span class="c">${c[0]}</span><span class="m">${c[1]}</span></div>`).join('');
    qChars.classList.add('show');
    const charBreak = chars.map(c=>`${c[0]}(${c[1]})`).join(' ');
    if(correct){
      quizCorrect++;
      qFeedback.className = 'q-feedback show correct';
      qFeedback.innerHTML = `정답입니다! <span class="ans-hanja">${hanja} (${reading})</span><br><span class="ans-breakdown">${charBreak}</span>`;
    } else {
      quizWrong.push(item);
      qFeedback.className = 'q-feedback show wrong';
      qFeedback.innerHTML = `오답입니다. 정답은 <span class="ans-hanja">${hanja} (${reading})</span> 입니다.<br><span class="ans-breakdown">${charBreak}</span>`;
    }
    qNext.classList.add('show');
    qNext.textContent = (quizIndex === quizPool.length-1) ? '결과 보기 →' : '다음 문제 →';
  }

  qCheck.addEventListener('click', checkAnswer);
  qInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      if(!currentAnswered) checkAnswer();
      else nextQuestion();
    }
  });
  qNext.addEventListener('click', nextQuestion);

  function nextQuestion(){
    if(quizIndex < quizPool.length-1){
      quizIndex++;
      showQuestion();
    } else {
      finishQuiz();
    }
  }

  function finishQuiz(){
    runningEl.style.display = 'none';
    resultEl.style.display = 'block';
    document.getElementById('result-score').textContent = `${quizCorrect} / ${quizPool.length}`;
    const pct = Math.round((quizCorrect/quizPool.length)*100);
    document.getElementById('result-sub').textContent = `정답률 ${pct}%`;
    const wrongListEl = document.getElementById('wrong-list');
    if(quizWrong.length === 0){
      wrongListEl.innerHTML = `<div class="empty-msg">모두 맞혔습니다! 훌륭해요 🎉</div>`;
      document.getElementById('retry-wrong').style.display = 'none';
    } else {
      document.getElementById('retry-wrong').style.display = 'inline-block';
      wrongListEl.innerHTML = `<h3>틀린 문제 (${quizWrong.length}개)</h3>` + quizWrong.map(item=>{
        const [no, hanja, reading, chars, meaning] = item;
        return `<div class="wrong-item"><span class="wh">${hanja}</span><span class="wr">${reading}</span><span class="wm">${meaning}</span></div>`;
      }).join('');
    }
  }

  startBtn.addEventListener('click', ()=>{
    const pool = getSelectedItems();
    if(pool.length === 0) return;
    startQuiz(pool);
  });

  document.getElementById('retry-wrong').addEventListener('click', ()=>{
    if(quizWrong.length === 0) return;
    startQuiz(quizWrong);
  });
  document.getElementById('retry-same').addEventListener('click', ()=>{
    startQuiz(lastPool);
  });
  document.getElementById('back-setup').addEventListener('click', ()=>{
    resultEl.style.display = 'none';
    setupEl.style.display = 'block';
  });

})();
</script>
</body>
</html>
